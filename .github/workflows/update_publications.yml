name: Update Citation Metrics

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  fetch-citation-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch citation metrics from Google Scholar
        run: python scripts/update_citation_metrics.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="citation-metrics-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add _data/scholar_metrics.yml
          git commit -m "Update citation metrics"
          git push --force origin "$branch"
          gh pr create --repo "${{ github.repository }}" --base master --head "$branch" \
            --title "Update citation metrics ($(date +%Y-%m))" \
            --body "Monthly Google Scholar metrics update: $(tr '\n' ' ' < _data/scholar_metrics.yml)" \
            || echo "Pull request already open for $branch"

{% include base_path %}
<div class="software-card">
  <div class="software-card__icon"><i class="fas fa-{{ post.icon | default: 'code' }}" aria-hidden="true"></i></div>
  <div class="software-card__body">
    <a class="software-card__title" href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
    <p class="software-card__desc">{{ post.excerpt | strip_html | strip }}</p>
    <div class="pub-links">
      {% if post.github %}<a href="{{ post.github }}" class="btn btn--inverse"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>{% endif %}
      {% if post.docs %}<a href="{{ post.docs }}" class="btn btn--inverse"><i class="fas fa-book" aria-hidden="true"></i> Docs</a>{% endif %}
      {% if post.doi %}<a href="https://doi.org/{{ post.doi }}" class="btn btn--inverse"><i class="ai ai-doi" aria-hidden="true"></i> DOI</a>{% endif %}
    </div>
  </div>
</div>
